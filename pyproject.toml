[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "asset-compass"
version = "0.1.0a1"
description = "A curated, agent-friendly index of useful 2D and 3D asset links"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "typer>=0.12,<1",
  "psycopg[binary]>=3.1,<4",
  "fastapi>=0.115,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
assetindex = "asset_compass.cli:app"
assetindex-api = "asset_compass.api:main"
assetindex-mcp = "asset_compass.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]

