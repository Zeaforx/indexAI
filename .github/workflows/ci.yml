name: indexAI checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-and-build:
    name: SQLite, API, MCP, recovery, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install Python and project dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --extra dev
      - name: Unit and integration tests
        run: uv run --no-sync pytest -q
      - name: Package build
        run: uv build

  postgresql:
    name: Live PostgreSQL migrations and full-text search
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: indexai
          POSTGRES_PASSWORD: indexai-ci-only
          POSTGRES_DB: indexai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indexai -d indexai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ASSET_COMPASS_TEST_POSTGRES_URL: postgresql+psycopg://indexai:indexai-ci-only@localhost:5432/indexai
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install Python and project dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --extra dev
      - name: PostgreSQL integration test (not a mock)
        run: uv run --no-sync pytest -q tests/test_postgres_integration.py
